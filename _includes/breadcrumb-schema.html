<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ site.url }}"
    }
    {%- if page.layout == 'recipe' -%}
    ,{
      "@type": "ListItem",
      "position": 2,
      "name": "Recipes",
      "item": "{{ site.url }}/recipes/"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": "{{ page.title }}",
      "item": "{{ site.url }}{{ page.url }}"
    }
    {%- elsif page.url != '/' -%}
    ,{
      "@type": "ListItem",
      "position": 2,
      "name": "{{ page.title }}",
      "item": "{{ site.url }}{{ page.url }}"
    }
    {%- endif -%}
  ]
}
</script>
