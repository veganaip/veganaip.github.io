<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Recipe",
  "name": "{{ page.title }}",
  "image": "{{ page.image | absolute_url }}",
  "description": "{{ page.description | default: page.notes | strip_html | strip_newlines | truncate: 160 | escape }}",
  "prepTime": "PT{{ page.prep_time }}M",
  "cookTime": "PT{{ page.cook_time }}M",
  "totalTime": "PT{{ page.prep_time | plus: page.cook_time }}M",
  "recipeYield": "{{ page.servings }} servings",
  "recipeCategory": "{{ page.categories | first | capitalize }}",
  "recipeCuisine": "Vegan AIP",
  "keywords": "vegan, AIP, autoimmune protocol, {{ page.categories | join: ', ' }}",
  "author": {
    "@type": "Organization",
    "name": "Vegan AIP Kitchen",
    "url": "https://veganaip.com"
  },
  "publisher": {
    "@type": "Organization",
    "name": "Vegan AIP Kitchen",
    "url": "https://veganaip.com"
  },
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "recipeIngredient": [
    {%- for ingredient in page.ingredients -%}
    {%- assign data_ingredient = site.data.ingredients[ingredient.id] -%}
    "{{ ingredient.amount }} {{ ingredient.name | default: data_ingredient.name | escape }}"{% unless forloop.last %},{% endunless %}
    {%- endfor -%}
  ],
  "recipeInstructions": [
    {%- for step in page.instructions -%}
    {
      "@type": "HowToStep",
      "position": {{ forloop.index }},
      "text": "{{ step | escape }}"
    }{% unless forloop.last %},{% endunless %}
    {%- endfor -%}
  ]
}
</script>
